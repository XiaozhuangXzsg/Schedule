org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# ---- 应用版本（发版时改这里，或由 CI 用 -Ptimetable.versionName 覆盖）----
# versionCode 由版本名推导：major*10000 + minor*100 + patch（3.0.0 -> 30000）。
# 3.0.0 起是正式版（界面与安装包都带「正式版」标识）；2.x 及更早用的是另一套四位版本号。
# 每次正式发布必须保证 versionCode 比上一版大，否则系统会拒绝覆盖安装。
timetable.versionName=3.1.0

# ---- 应用内更新渠道（GitHub Releases）----
# 换仓库只改这两行：客户端从 BuildConfig 读取，代码里没有第二处硬编码。
timetable.github.owner=XiaozhuangXzsg
timetable.github.repo=Schedule
